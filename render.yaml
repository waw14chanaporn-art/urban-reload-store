services:
  - type: web
    name: urban-reload-store
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: urban-reload-data
      mountPath: /var/data
      sizeGB: 1
